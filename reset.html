<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password · Pinned</title>
  <link rel="icon" href="icon32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="board-page">
  <main class="wrap">
    <h1>Pinned</h1>
    <p id="boot" class="state">Checking your reset link…</p>
    <section id="card" class="card" hidden>
      <h2>Set a new password</h2>
      <form id="form" novalidate>
        <label class="field"><span>New password</span><input id="pw1" type="password" autocomplete="new-password" minlength="8"></label>
        <label class="field"><span>Repeat it</span><input id="pw2" type="password" autocomplete="new-password" minlength="8"></label>
        <p id="msg" class="msg" role="alert"></p>
        <button id="btn" class="block" type="submit">Save password</button>
      </form>
    </section>
    <p id="bad" class="msg err" hidden>This reset link has expired or was already used. <a href="index.html">Go back</a> and choose "Forgot password?" for a new one.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const say = (t, k = '') => { $('msg').textContent = t; $('msg').className = `msg ${k}`; };
    let ready = false;
    const ok = () => { ready = true; $('boot').hidden = true; $('bad').hidden = true; $('card').hidden = false; };

    if (!configured) {
      $('boot').textContent = 'Setup needed: open config.js and add your Supabase URL and anon key.';
    } else {
      // Supabase reads the link's token and fires PASSWORD_RECOVERY.
      db.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') ok(); });
      setTimeout(() => { if (!ready) { $('boot').hidden = true; $('bad').hidden = false; } }, 4000);
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const a = $('pw1').value, b = $('pw2').value;
      if (a.length < 8) return say('Use at least 8 characters.', 'err');
      if (a !== b) return say('The two passwords do not match.', 'err');
      $('btn').disabled = true; $('btn').textContent = 'Saving…'; say('');
      const { error } = await db.auth.updateUser({ password: a });
      if (error) {
        $('btn').disabled = false; $('btn').textContent = 'Save password';
        return say(error.message, 'err');
      }
      say('Password updated. Taking you to your notes…', 'ok');
      setTimeout(() => { location.href = 'index.html'; }, 1200);
    });
  </script>
</body>
</html>
